<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Расписание занятий группы МИК-25">
  <title>МИК.COM — расписание</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <button class="menu-button" id="menuBtn" aria-label="Открыть меню" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <div class="date-time" aria-label="Текущие дата и время">
    <time class="clock-time" id="clockTime">--:--</time>
    <time class="clock-date" id="clockDate">Загрузка даты…</time>
  </div>

  <div class="menu-overlay" id="menuOverlay"></div>

  <aside class="side-panel" id="sidePanel" aria-hidden="true">
    <div class="panel-header">
      <div>
        <div class="panel-date" id="todayDate">—</div>
        <div class="panel-day" id="todayDay">—</div>
      </div>
      <button class="close-panel" id="closePanel" aria-label="Закрыть меню">×</button>
    </div>

    <nav class="menu-nav">
      <button class="menu-item active" data-section="schedule"><span>📅</span> Расписание</button>
      <button class="menu-item" data-section="wallpapers"><span>🖼️</span> Обои</button>
      <div class="menu-item theme-row">
        <span>🌙</span><span>Сменить тему</span>
        <button class="ios-switch" id="themeSwitch" role="switch" aria-label="Сменить тему" aria-checked="false"><span></span></button>
      </div>
    </nav>

    <div class="panel-footer">Настройки сохраняются на этом устройстве.</div>
  </aside>

  <main class="container" id="app">
    <section id="scheduleSection" class="app-section active-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">МИК — 1 КУРС</p>
          <h1>Расписание</h1>
          <p id="scheduleSubtitle">—</p>
        </div>
      </div>

      <div class="schedule-week">
        <span class="menu-card-title">Неделя</span>
        <div class="week-controls">
          <button id="prevWeek" aria-label="Предыдущая неделя">‹</button>
          <strong id="currentWeekLabel">—</strong>
          <button id="nextWeek" aria-label="Следующая неделя">›</button>
        </div>
      </div>

      <div id="scheduleContainer" aria-live="polite">
        <div class="empty-state">Загружаем расписание…</div>
      </div>
    </section>

    <section id="wallpapersSection" class="app-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">ОФОРМЛЕНИЕ</p>
          <h1>Обои</h1>
          <p>Выбери фон для сайта. Настройка сохраняется на этом устройстве.</p>
        </div>
      </div>
      <div class="wallpaper-grid" id="wallpaperGrid"></div>
      <label class="upload-wallpaper">＋ Выбрать своё изображение
        <input id="wallpaperInput" type="file" accept="image/*">
      </label>
      <button class="secondary-action" id="resetWallpaper" type="button">Сбросить мои обои</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
